<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Portal Móvil de Vídeos</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #131b31;
      --border: #263457;
      --text: #eef3ff;
      --muted: #98aed6;
      --accent: #3b82f6;
      --ok: #10b981;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border: 3px solid rgba(59,130,246,0.22);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.45; margin: 0 0 16px; }
    .meta { font-size: 12px; color: #7890bd; margin-bottom: 16px; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-top: 8px;
    }
    .btn.secondary {
      background: #1e2a4a;
      color: #d6e3ff;
      border: 1px solid var(--border);
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0d1426;
      color: #fff;
      font-size: 15px;
      margin-bottom: 10px;
      text-align: center;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div id="spinner" class="spinner"></div>
    <h1 id="title">Conectando con tu portal...</h1>
    <p id="msg">Buscando la dirección activa del portátil.</p>
    <div id="meta" class="meta"></div>

    <div id="tokenBox" class="hidden">
      <input id="tokenInput" type="password" placeholder="Clave de acceso del portal" autocomplete="off" />
      <button id="saveTokenBtn" class="btn">Entrar</button>
    </div>

    <div id="actions" class="hidden">
      <button id="retryBtn" class="btn">Reintentar ahora</button>
      <a id="directLink" class="btn secondary hidden" href="#">Abrir enlace directo</a>
    </div>
  </div>

<script>
(function () {
  const OWNER = "propuestas-web-pro";
  const REPO = "portal-movil";
  const STORAGE_KEY = "vp_portal_token_v1";

  const elSpinner = document.getElementById("spinner");
  const elTitle = document.getElementById("title");
  const elMsg = document.getElementById("msg");
  const elMeta = document.getElementById("meta");
  const elTokenBox = document.getElementById("tokenBox");
  const elTokenInput = document.getElementById("tokenInput");
  const elSaveTokenBtn = document.getElementById("saveTokenBtn");
  const elActions = document.getElementById("actions");
  const elRetryBtn = document.getElementById("retryBtn");
  const elDirectLink = document.getElementById("directLink");

  let retryTimer = null;

  function getToken() {
    const hashRaw = (window.location.hash || "").replace(/^#\/?/, "").trim();
    const qsToken = new URLSearchParams(window.location.search).get("k") || "";
    const candidate = (hashRaw || qsToken).replace(/[^a-zA-Z0-9_-]/g, "");
    if (candidate.length >= 6) {
      try { localStorage.setItem(STORAGE_KEY, candidate); } catch (e) {}
      return candidate;
    }
    try {
      const saved = (localStorage.getItem(STORAGE_KEY) || "").trim();
      if (saved.length >= 6) return saved;
    } catch (e) {}
    return "";
  }

  async function fetchTunnelInfo() {
    const ts = Date.now();
    // 1. GitHub Contents API (actualización instantánea sin caché de 10 min de Pages)
    try {
      const r = await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/url.json?t=${ts}`,
        { cache: "no-store" }
      );
      if (r.ok) {
        const meta = await r.json();
        if (meta && meta.content) {
          const decoded = atob(meta.content.replace(/\n/g, ""));
          const parsed = JSON.parse(decoded);
          if (parsed && parsed.tunnel_base) return parsed;
        }
      }
    } catch (e) {}

    // 2. Fallback: raw.githubusercontent.com
    try {
      const r = await fetch(
        `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/url.json?t=${ts}`,
        { cache: "no-store" }
      );
      if (r.ok) {
        const parsed = await r.json();
        if (parsed && parsed.tunnel_base) return parsed;
      }
    } catch (e) {}

    // 3. Fallback: archivo local de GitHub Pages
    const r = await fetch(`./url.json?t=${ts}`, { cache: "no-store" });
    if (r.ok) {
      const parsed = await r.json();
      if (parsed && parsed.tunnel_base) return parsed;
    }
    throw new Error("No se pudo leer la URL activa");
  }

  async function isTunnelOnline(tunnelBase) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5500);
    try {
      const r = await fetch(`${tunnelBase.replace(/\/+$/, "")}/health?t=${Date.now()}`, {
        cache: "no-store",
        signal: ctrl.signal,
      });
      return r.ok;
    } catch (e) {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }

  async function connect() {
    if (retryTimer) {
      clearTimeout(retryTimer);
      retryTimer = null;
    }
    const token = getToken();
    if (!token) {
      elSpinner.classList.add("hidden");
      elTitle.textContent = "Acceso privado";
      elMsg.textContent = "Introduce tu clave una sola vez; quedará guardada en este móvil.";
      elTokenBox.classList.remove("hidden");
      elActions.classList.add("hidden");
      return;
    }

    elTokenBox.classList.add("hidden");
    elSpinner.classList.remove("hidden");
    elTitle.textContent = "Conectando con tu portal...";
    elMsg.textContent = "Comprobando conexión con el portátil.";

    try {
      const info = await fetchTunnelInfo();
      const base = String(info.tunnel_base || "").replace(/\/+$/, "");
      const target = `${base}/m/${encodeURIComponent(token)}`;
      if (info.updated_at) {
        elMeta.textContent = `Última actualización del portátil: ${info.updated_at}`;
      }
      elDirectLink.href = target;
      elDirectLink.classList.remove("hidden");

      const online = await isTunnelOnline(base);
      if (online) {
        elTitle.textContent = "Portal conectado";
        elMsg.textContent = "Abriendo tus vídeos...";
        window.location.replace(target);
        return;
      }

      elSpinner.classList.add("hidden");
      elTitle.textContent = "Portátil apagado o arrancando";
      elMsg.textContent = "En cuanto el portátil se encienda y conecte a Wi-Fi, entrarás automáticamente. Reintentando cada 6 segundos...";
      elActions.classList.remove("hidden");
      retryTimer = setTimeout(connect, 6000);
    } catch (err) {
      elSpinner.classList.add("hidden");
      elTitle.textContent = "Sin conexión temporal";
      elMsg.textContent = "No se pudo consultar el estado. Reintentando en 6 segundos...";
      elActions.classList.remove("hidden");
      retryTimer = setTimeout(connect, 6000);
    }
  }

  elSaveTokenBtn.addEventListener("click", () => {
    const val = (elTokenInput.value || "").trim().replace(/[^a-zA-Z0-9_-]/g, "");
    if (val.length < 6) return;
    try { localStorage.setItem(STORAGE_KEY, val); } catch (e) {}
    window.location.hash = val;
    connect();
  });

  elRetryBtn.addEventListener("click", connect);
  connect();
})();
</script>
</body>
</html>
